name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # No hay ESLint configurado en este proyecto (ver AGENTS.md) — si se agrega
      # un script "lint" a package.json en el futuro, sumar un step acá.

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
