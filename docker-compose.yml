# Postgres local para la rama dev. test y prod viven en Coolify (ver .claude/modules/entornos.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432' # solo loopback
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
